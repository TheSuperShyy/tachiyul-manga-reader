<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#050814"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Book shape -->
  <path d="M8 16 L32 12 L56 16 L56 48 L32 44 L8 48 Z" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <path d="M32 12 L32 44" stroke="#3b82f6" stroke-width="2"/>
  <!-- GS text with glow -->
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">GS</text>
</svg>
